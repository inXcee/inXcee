<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YYS">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#080b10">
  <meta name="msapplication-TileColor" content="#080b10">
  <meta name="msapplication-TileImage" content="/icon-192.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
  <link rel="apple-touch-icon" href="/icon-192.svg">
  <title>YYS — Yatakhane Yönetim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Splash — JS bundle yuklenene kadar gosterilir, App mount olunca innerHTML temizlenir */
    #yys-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: #080b10; color: #f0a500; z-index: 9999;
      font-family: -apple-system, system-ui, sans-serif;
    }
    #yys-splash .logo {
      width: 92px; height: 92px; border-radius: 18px;
      background: #0d1117; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 28px; letter-spacing: 1px;
      box-shadow: 0 0 32px rgba(240,165,0,0.15);
    }
    #yys-splash .spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(240,165,0,0.2); border-top-color: #f0a500;
      animation: yys-spin 0.8s linear infinite;
    }
    @keyframes yys-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="yys-splash">
      <div class="logo">YYS</div>
      <div class="spin"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script src="/sw-register.js" defer></script>
</body>
</html>
