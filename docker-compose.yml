# YYS — Production Compose
# Kullanım:
#   cp .env.example .env  (JWT_SECRET ve ALLOWED_ORIGIN doldur)
#   docker compose up -d --build
#
# Erişim:  http://localhost:8080  (frontend)
#          http://localhost:3001  (backend, opsiyonel direkt)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yys-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env'de tanimli olmali}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "1"
      DB_PATH: /var/data/yys.db
      UPLOADS_DIR: /var/data/uploads
      BACKUP_DIR: /var/data/backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - yys-data:/var/data
    expose:
      - "3001"
    # Direkt erişim isterseniz açın:
    # ports:
    #   - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: yys-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  yys-data:
    driver: local
