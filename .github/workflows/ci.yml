name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: cd backend && npx vitest run
        env:
          DB_PATH: ':memory:'

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Check for console.log in production code
        run: |
          FOUND=$(grep -r "console\.log" backend/src/ --include="*.js" -l | grep -v node_modules | grep -v ".test." || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: console.log found in production files:"
            echo "$FOUND"
          fi
