name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency signatures (supply-chain)
        # Her paketin npm registry imzasi/attestation'i ile eslestigini dogrular.
        # Tampered tarball veya typosquat (lockfile drift) burada fail eder.
        run: npm audit signatures

      - name: Run backend tests
        run: cd backend && npx vitest run
        env:
          DB_PATH: ':memory:'

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: cd frontend && npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Check for console.log in production code
        run: |
          FOUND=$(grep -r "console\.log" backend/src/ --include="*.js" -l | grep -v node_modules | grep -v ".test." || true)
          if [ -n "$FOUND" ]; then
            echo "WARNING: console.log found in production files:"
            echo "$FOUND"
          fi
