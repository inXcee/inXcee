server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Body limit (foto upload için): magic byte kontrolü backend'de var, bu sadece üst sınır
    client_max_body_size 10m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxy
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: buffering kapalı, uzun timeout zorunlu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Yüklenen dosyalar (foto, imza) — ^~ şart: yoksa aşağıdaki uzantı
    # regex'i (.jpg vs.) kazanır ve dist/ içinde arayıp 404 döner
    location ^~ /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    # Statik asset cache
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
