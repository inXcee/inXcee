# ── Özel finans kasası (FinansApp) — yalnız YYS sahibi (users.is_owner) ──────────
# Sunucuda: /etc/nginx/snippets/finance-kasa.conf. Server bloğunda, include'dan ÖNCE:
#   set $pf_backend 127.0.0.1:3001;      # staging: 127.0.0.1:3002
#   set $pf_root    /opt/finance-kasa;   # içinde kasa/ klasörü (FinansApp build:kasa çıktısı)
#   include /etc/nginx/snippets/finance-kasa.conf;
# http bağlamında ayrıca: /etc/nginx/conf.d/finance-kasa-map.conf ($pf_cache).
#
# Her istek (index + her asset) önce /api/pf/gate'e sorulur. Sahip değilse YYS'nin
# kendi index.html'i 200 ile döner — bilinmeyen herhangi bir adresle aynı; adresin
# özel olduğu dışarıdan anlaşılmaz.
# ^~ önek ŞART: aksi halde server'daki `\.(js|css...)$` regex kuralı /kasa/assets/*'ı
# kapıyı atlayarak (ve yanlış kökten) sunardı.
location ^~ /kasa/ {
    auth_request /__pf_gate;
    error_page 401 403 = /index.html;
    root $pf_root;
    try_files $uri $uri/ /kasa/index.html;

    # Server'daki güvenlik başlıkları burada yeniden tanımlanır (add_header kalıtımı
    # location'da kesilir). CSP FinansApp'in gerçekten kullandığı servislere göre;
    # satır içi script yok ('unsafe-inline' yok).
    add_header Cache-Control $pf_cache always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://s3.tradingview.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https://assets.mixkit.co; connect-src 'self' https://open.er-api.com https://generativelanguage.googleapis.com https://api.binance.com https://fapi.binance.com https://api.bybit.com https://www.okx.com https://open-api.bingx.com https://api.coingecko.com https://min-api.cryptocompare.com https://api.alternative.me wss://stream.binance.com wss://fstream.binance.com; frame-src https://*.tradingview.com https://*.tradingview-widget.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}

location = /__pf_gate {
    internal;
    proxy_pass http://$pf_backend/api/pf/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
