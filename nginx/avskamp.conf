# ════════════════════════════════════════════════════════════════════
# AVSKAMP YYS — Nginx Production Konfigürasyonu (VPS, native)
# ════════════════════════════════════════════════════════════════════
# server-setup.sh tarafından kopyalanır:
#   __DOMAIN__   → avskamp.com (sed ile değiştirilir)
#   __APP_DIR__  → /opt/avskamp (sed ile değiştirilir)
#
# certbot --nginx çağrıldığında HTTPS yönlendirmesi otomatik eklenir.
# ════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Frontend statik dosyalar
    root __APP_DIR__/frontend/dist;
    index index.html;

    # Body limit (foto upload için)
    client_max_body_size 10m;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — React Router için
    # index.html her zaman fresh: yeni deploy'da hash'li chunk dosyaları değişir,
    # eski index.html cache'lenirse browser yok olan chunk'ı ister ve
    # "Failed to fetch dynamically imported module" hatası alır.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (notifications/stream): buffering kapalı, uzun timeout zorunlu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Yüklenen dosyalar (foto, imza)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statik asset cache (Vite hash'li dosyalar — uzun cache güvenli)
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /robots.txt — arama motoru indexlemesin (iç sistem)
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # /favicon.ico errors → log'u şişirme
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
