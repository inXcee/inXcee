# ── Sesli Hermes (/hermes/) — yalnız YYS sahibi (users.is_owner) ───────────────────────────────
# Sunucuda: /etc/nginx/snippets/hermes-voice.conf. Server bloğunda finance-kasa include'unun hemen ARDINA:
#   include /etc/nginx/snippets/hermes-voice.conf;
# Kasa için zaten tanımlı $pf_backend'i kullanır (canlı 127.0.0.1:3001, staging 127.0.0.1:3002).
# Ayrıntı: docs/hermes-voice.md
#
# Sayfa ve dosyaları her istekte /api/hermes/gate'e sorulur; sahip değilse YYS'nin kendi index.html'i döner
# (adresin özel olduğu dışarıdan anlaşılmaz). Site genelinde mikrofon KAPALI (security-headers.conf:
# microphone=()) — ses tanıma yalnız bu konumda açılır: microphone=(self).
# ^~ önek ŞART: aksi halde server'daki `\.(js|css...)$` regex kuralı /hermes/app.js'i kapıyı atlayarak sunardı.
location ^~ /hermes/ {
    auth_request /__hermes_gate;
    error_page 401 403 = /index.html;
    try_files $uri $uri/ /hermes/index.html;

    # Sayfa küçük, dosya adları hash'siz → her açılışta doğrulansın (ETag ile 304)
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}

# Manifest + ikonlar KAPISIZ: Android'in uygulama kurulumu (WebAPK) bunları oturum çerezi olmadan çeker.
# İçlerinde kişisel bir şey yok (ad "Hermes", ikon).
location ^~ /hermes-pub/ {
    types { application/manifest+json webmanifest; image/png png; }
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /__hermes_gate {
    internal;
    proxy_pass http://$pf_backend/api/hermes/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
