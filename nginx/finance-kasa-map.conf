# http bağlamı (/etc/nginx/conf.d/finance-kasa-map.conf) — bkz. finance-kasa.conf.
# Vite hash'li asset'ler sahibin tarayıcısında önbelleklenir (private: ara vekiller tutmaz);
# index.html her açılışta kapıdan geçsin diye hiç önbelleklenmez.
map $uri $pf_cache {
    ~^/kasa/assets/  "private, max-age=604800, immutable";
    default          "no-store";
}
